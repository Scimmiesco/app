<div class="card-brutalista space-y-4" data-testid="card-resumo-economia">
  <app-cabecalho-secao
    [secao]="secao()"
    [fonte]="fonte()"
    [kickerTestId]="'resumo-economia-kicker'"
    [tituloTestId]="'resumo-economia-titulo'"
    [textoCurado]="true"
  />

  @if (secao().status === 'pendente') {
    <div class="bloco-pendente">
      <strong>Dado pendente:</strong> {{ secao().motivo || 'Em fase de apuração oficial.' }}
    </div>
  } @else if (secao().dados; as dadosEco) {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="metric-card" data-testid="card-metrica-pib-total">
        <span class="metric-label">PIB Total</span>
        <span class="metric-value-lg">{{ formatarMoeda(dadosEco.pib_total) }}</span>
      </div>
      <div class="metric-card" data-testid="card-metrica-pib-per-capita">
        <span class="metric-label">PIB Per Capita</span>
        <span class="metric-value-lg">{{ formatarMoeda(dadosEco.pib_per_capita) }}</span>
      </div>
    </div>
  }
</div>
