<div class="card-brutalista space-y-4" data-testid="card-prefeito">
  <app-cabecalho-secao
    [secao]="secao()"
    [mostrarFonte]="false"
    [mostrarMandato]="true"
    [kickerTestId]="'prefeito-kicker'"
    [tituloTestId]="'prefeito-titulo'"
    categoriaPadrao="MANDATO LOCAL"
  />

  @if (prefeito().length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      @for (pref of prefeito(); track pref.nome) {
        <div
          class="metric-card bg-white col-span-1 sm:col-span-3 flex flex-wrap items-center justify-between gap-3 p-4"
        >
          <app-cartao-parlamentar
            [parlamentar]="pref"
            contexto="prefeito"
            cargo="Prefeita Municipal"
            [tamanhoNomeLg]="true"
            class="flex-1 min-w-0"
          />
          <div class="text-right">
            <span class="metric-label">Votos no Pleito Municipal</span>
            <span class="metric-value">{{ formatarNumero(pref.votos) }}</span>
            <span class="badge badge-xs badge-oficial block mt-1">Em Exercício</span>
          </div>
        </div>
      }
    </div>
  }
</div>
