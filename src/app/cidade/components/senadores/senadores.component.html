<div class="card-brutalista space-y-4" data-testid="card-senadores">
  <app-cabecalho-secao
    [secao]="secao()"
    [fonte]="fonte()"
    [mostrarFonte]="true"
    [kickerTestId]="'senadores-kicker'"
    [tituloTestId]="'senadores-titulo'"
    categoriaPadrao="ELEIÇÃO 2026"
    badgeTestId="senadores-badge-status"
    linkTestId="senadores-link-fonte"
  />

  <div class="tabela-wrapper">
    <table class="tabela-brutalista">
      <thead>
        <tr>
          <th scope="col">Candidato</th>
          <th scope="col" class="col-center">Mandato</th>
        </tr>
      </thead>
      <tbody>
        @for (sen of senadores(); track sen.nome) {
          <tr
            [class.em-exercicio]="sen.em_exercicio"
            [attr.data-testid]="'linha-senador-' + sen.nome_urna.toLowerCase()"
          >
            <td class="cell-nome">
              <app-cartao-parlamentar [parlamentar]="sen" [anoPleito]="secao().ano" />
            </td>
            <td class="cell-mandato-fim">
              @if (sen.mandato_inicio) {
                <span class="block sm:inline">{{ formatarDataIso(sen.mandato_inicio) }} a </span>
              }
              <span>{{ formatarDataIso(sen.mandato_fim) }}</span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
