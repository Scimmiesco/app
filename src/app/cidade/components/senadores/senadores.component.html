<div class="card-brutalista space-y-4" data-testid="card-senadores">
  <app-cabecalho-secao
    [secao]="secao()"
    [mostrarFonte]="false"
    [kickerTestId]="'senadores-kicker'"
    [tituloTestId]="'senadores-titulo'"
    categoriaPadrao="ELEIÇÃO 2026"
  />

  <div class="tabela-wrapper">
    <table class="tabela-brutalista">
      <thead>
        <tr>
          <th scope="col">Candidato</th>
          <th scope="col" class="col-center hidden sm:table-cell">Em Exercício</th>
          <th scope="col" class="col-center hidden sm:table-cell">Mandato</th>
          <th scope="col">Situação</th>
        </tr>
      </thead>
      <tbody>
        @for (sen of senadores(); track sen.nome) {
          <tr
            [class.em-exercicio]="sen.em_exercicio"
            [attr.data-testid]="'linha-senador-' + sen.nome_urna.toLowerCase()"
          >
            <td class="cell-nome">
              <app-cartao-parlamentar [parlamentar]="sen" contexto="senador" />
            </td>
            <td class="cell-center hidden sm:table-cell">
              @if (sen.em_exercicio) {
                <span class="badge badge-xs badge-exercicio-sim">SIM</span>
              } @else {
                <span class="badge badge-xs badge-exercicio-nao">NÃO</span>
              }
            </td>
            <td class="cell-mandato-fim hidden sm:table-cell">
              {{ sen.mandato_inicio ? formatarDataIso(sen.mandato_inicio) + ' a ' : ''
              }}{{ formatarDataIso(sen.mandato_fim) }}
            </td>
            <td class="cell-situacao">{{ sen.situacao || '—' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
