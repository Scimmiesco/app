<div class="card-brutalista space-y-4" data-testid="card-vereadores">
  <app-cabecalho-secao
    [secao]="secao()"
    [mostrarFonte]="false"
    [mostrarMandato]="true"
    [kickerTestId]="'vereadores-kicker'"
    [tituloTestId]="'vereadores-titulo'"
    categoriaPadrao="MANDATO LOCAL"
  />

  <div class="tabela-wrapper">
    <table class="tabela-brutalista">
      <thead>
        <tr>
          <th scope="col">Candidato</th>
          <th scope="col" class="col-right">Votos</th>
          <th scope="col" class="col-right">% Votos</th>
          <th scope="col" class="col-center hidden sm:table-cell">Exercício</th>
          <th scope="col">Situação</th>
        </tr>
      </thead>
      <tbody>
        @for (ver of vereadores(); track ver.nome) {
          <tr>
            <td class="cell-nome">
              <app-cartao-parlamentar [parlamentar]="ver" contexto="vereador" />
            </td>
            <td class="cell-votos">{{ formatarNumero(ver.votos) }}</td>
            <td class="cell-pct">{{ formatarPct(ver.pct) }}</td>
            <td class="cell-center hidden sm:table-cell">
              <span class="badge badge-xs badge-exercicio-sim">SIM</span>
            </td>
            <td class="cell-situacao">{{ ver.situacao || 'ELEITO' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
